name: Update food database
on:
  schedule:
    - cron: "0 3 1 * *"        # 1. den v mesici o 3:00 UTC
  workflow_dispatch: {}         # nebo rucne tlacitkem
permissions:
  contents: write
jobs:
  foods:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build_foods_dump.py
      - run: |
          git config user.name "leaflet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add foods.json
          git diff --cached --quiet || (git commit -m "Update food database" && git push)
