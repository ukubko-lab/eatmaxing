name: Update leaflets
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scrape.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - run: |
          git config user.name "leaflet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet || (git commit -m "Update leaflets" && git push)
